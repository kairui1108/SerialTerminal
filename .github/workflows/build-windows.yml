name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  release:
    types:
      - published # 发布 GitHub Release 时触发
  workflow_dispatch: # 允许手动触发

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --release -- -D warnings

      - name: Run tests
        run: cargo test --release

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: serial-term-windows-x64
          path: target/x86_64-pc-windows-gnu/release/serial-term.exe
          if-no-files-found: error

  # 发布 Release：push v* tag 时自动创建，或手动发布时附加 exe
  release:
    name: Attach binaries to release
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 统一提取当前 tag 名：release 事件用 release.tag_name，push tag 用 GITHUB_REF
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # 从 RELEASE_NOTE.md 提取对应版本的变更记录（tag v1.0.9 -> [1.0.9] 区块，回退 [Unreleased]）
      - name: Extract release notes
        id: extract
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VER_NUM="${VERSION#v}"
          python3 - "$VER_NUM" << 'PYEOF'
          import re, sys, os, base64
          version = sys.argv[1]
          content = open('RELEASE_NOTE.md', encoding='utf-8').read()
          pattern = re.compile(
              r"##\s+\[(?P<ver>[^\]]+)\][^\n]*\n(?P<body>.*?)(?=\n##\s+\[|$)",
              re.DOTALL
          )
          notes = ''
          for m in pattern.finditer(content):
              if m.group('ver').strip() == version:
                  notes = m.group('body').strip()
                  break
          if not notes:
              for m in pattern.finditer(content):
                  if m.group('ver').strip() == 'Unreleased':
                      notes = m.group('body').strip()
                      break
          gh_out = os.environ.get('GITHUB_OUTPUT', '')
          if gh_out:
              with open(gh_out, 'a', encoding='utf-8') as f:
                  f.write(f"notes={base64.b64encode(notes.encode('utf-8')).decode()}\n")
          PYEOF

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: serial-term-windows-x64
          path: release-assets/

      # 解码变更记录写入文件，供 release body 使用
      - name: Prepare release body
        id: body
        shell: bash
        run: |
          ENC="${{ steps.extract.outputs.notes }}"
          if [ -z "$ENC" ]; then
            printf '自动构建版本' > /tmp/release_body.txt
          else
            echo "$ENC" | base64 --decode > /tmp/release_body.txt
          fi

      # 将 exe 附加到对应 release（push tag 时自动创建 release），并用变更记录作为描述
      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: release-assets/serial-term.exe
          body_path: /tmp/release_body.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
