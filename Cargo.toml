[package]
name = "serial-term"
version = "1.0.0"
edition = "2024"
description = "跨平台串口终端，可无缝集成 Windows Terminal（Rust 重构版）"
license = "MIT"

[dependencies]
serialport = { version = "4", default-features = false }
encoding_rs = "0.8"
chardetng = "0.1"
crossterm = "0.28"
ratatui = "0.28"
tui-textarea = "0.6"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
crossbeam-channel = "0.5"
directories = "5"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[build-dependencies]
# winres 跨平台可用（非 Windows 目标在 build.rs 中不调用）
winres = "0.1"

[profile.release]
strip = true
lto = "thin"
